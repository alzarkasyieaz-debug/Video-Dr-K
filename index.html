    <style>
      :root {
        --navy: #081a32;
        --gold: #d6ac52;
        --yellow: #ffd447;
        --ground: #080b13;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: var(--ground);
        z-index: 0;
      }
      /* Camera: one wrapper moves for every punch-in and push. Media inside are 1080x1440 (3:4 crop of the 4K plate). */
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        z-index: 1;
      }
      #cam video,
      #cam img {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1440px;
        object-fit: cover;
      }
      /* Navy information band over the top of the frame, and a calm floor under the platform UI. */
      #band {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 620px;
        background: linear-gradient(
          180deg,
          #081a32 0%,
          rgba(8, 26, 50, 0.96) 34%,
          rgba(8, 26, 50, 0.62) 62%,
          rgba(8, 26, 50, 0) 100%
        );
        z-index: 2;
      }
      #floor {
        position: absolute;
        left: 0;
        top: 1180px;
        width: 1080px;
        height: 740px;
        background: linear-gradient(
          180deg,
          rgba(8, 11, 19, 0) 0%,
          rgba(8, 11, 19, 0.55) 35%,
          rgba(8, 11, 19, 0.85) 100%
        );
        z-index: 2;
      }
      #dip {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        z-index: 3;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Camera framings. Face centre in the 1080x1440 plate sits at (540, 403).
      const FACE_Y = 403;
      const frame = (s, fy = 790) => ({ scale: s, x: (1080 - 1080 * s) / 2, y: fy - FACE_Y * s });
      const WIDE = 1.3333;

      // S1 hook: open wide, hard punch-in on "senyap", slow push.
      tl.set("#cam", frame(WIDE), 0);
      tl.set("#cam", frame(1.6, 760), 0.86);
      tl.to("#cam", { ...frame(1.7, 760), duration: 5.3, ease: "none" }, 0.86);
      // Dip cut into the full speech.
      tl.to("#dip", { opacity: 0.4, duration: 0.1, ease: "power1.in" }, 6.3);
      tl.set("#dip", { opacity: 0 }, 6.4);

      // S2 issue: wide, slow cinematic push across the project list.
      tl.set("#cam", frame(WIDE), 6.4);
      tl.to("#cam", { ...frame(1.45), duration: 15.0, ease: "none" }, 6.4);

      // S3 argument 1: punch-in on "senyap seribu bahasa" (source 15.94 s).
      tl.set("#cam", frame(1.62, 770), 22.3);
      tl.to("#cam", { ...frame(1.68, 770), duration: 5.6, ease: "none" }, 22.3);
      // Back out on "Jadi semua projek-projek ini penting".
      tl.set("#cam", frame(1.4), 27.9);
      tl.to("#cam", { ...frame(1.46), duration: 4.0, ease: "none" }, 27.9);
      // Argument 2: inclusive development, push.
      tl.set("#cam", frame(WIDE), 32.0);
      tl.to("#cam", { ...frame(1.5), duration: 8.2, ease: "none" }, 32.0);

      // S5 climax: cinematic close-up, then ease back for the closing line.
      tl.set("#cam", frame(1.72, 760), 40.2);
      tl.to("#cam", { ...frame(1.78, 760), duration: 7.6, ease: "none" }, 40.2);
      tl.to("#cam", { ...frame(1.5), duration: 1.2, ease: "power2.inOut" }, 47.9);
      tl.to("#cam", { ...frame(1.56), duration: 3.8, ease: "none" }, 49.1);

      // S6 final: slow push on the held frame under the end card, fade out.
      tl.to("#cam", { ...frame(1.66), duration: 7.1, ease: "none" }, 52.9);
      tl.to("#dip", { opacity: 1, duration: 0.9, ease: "power2.in" }, 59.0);

      window.__timelines["main"] = tl;
    </script>
