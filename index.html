<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Suara Pesawah Parit — Dewan Rakyat</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --navy: #07111f;
        --navy-2: #0d1d33;
        --charcoal: #0b0d12;
        --gold: #f2c55c;
        --gold-deep: #b8892c;
        --silver: #e7ebf2;
        --font: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--charcoal); font-family: var(--font);
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* ---------- ground (seen around the "hyperframe" panel) ---------- */
      #bg { position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(900px 700px at 50% 30%, rgba(40,74,124,.55), transparent 70%),
          radial-gradient(700px 600px at 50% 95%, rgba(242,197,92,.10), transparent 70%),
          linear-gradient(180deg, #0a1628 0%, #07111f 55%, #05080f 100%);
      }
      /* vertical fins: abstract nod to the tower's sun-screen rhythm (decorative only) */
      #bg-fins { position: absolute; inset: 0; z-index: 1; opacity: .5;
        background: repeating-linear-gradient(90deg, rgba(231,235,242,.045) 0 2px, transparent 2px 54px);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 80%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 80%, transparent 100%);
      }

      /* ---------- camera rig: #cam moves, #mask crops, videos are timed ---------- */
      #cam { position: absolute; inset: 0; z-index: 2; transform-origin: 540px 430px; }
      #mask { position: absolute; inset: 0; clip-path: inset(0px 0px 0px 0px round 0px); }
      #mask video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      #pframe { position: absolute; z-index: 3; left: 36px; top: 150px; width: 1008px; height: 670px;
        border-radius: 28px; border: 2px solid rgba(242,197,92,.85); opacity: 0;
        box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 80px rgba(0,0,0,.65), 0 0 40px rgba(242,197,92,.18) inset;
      }
      #pframe-tag { position: absolute; left: 22px; bottom: -19px; padding: 6px 14px; border-radius: 6px;
        background: var(--gold); color: #1a1406; font-weight: 800; font-size: 28px; letter-spacing: .12em; }

      #scrim { position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(4,8,16,.55) 0%, rgba(4,8,16,0) 16%),
          linear-gradient(180deg, rgba(4,8,16,0) 52%, rgba(4,8,16,.62) 66%, rgba(4,8,16,.88) 80%, rgba(4,8,16,.94) 100%);
      }
      #grade-vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(1100px 1500px at 50% 38%, transparent 55%, rgba(0,0,0,.45) 100%); }

      #flash { position: absolute; inset: 0; z-index: 30; background: #fff7e2; opacity: 0; pointer-events: none; }
      #sweep { position: absolute; z-index: 29; left: -700px; top: -200px; width: 520px; height: 2400px; opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(255,236,190,.0) 20%, rgba(255,236,190,.28) 50%, rgba(255,236,190,0) 80%, transparent);
        pointer-events: none; }

      #bug { position: absolute; z-index: 20; left: 44px; top: 186px; display: flex; align-items: center; gap: 12px;
        padding: 10px 18px 10px 14px; border-radius: 10px; background: rgba(7,17,31,.72);
        border: 1px solid rgba(242,197,92,.45); color: var(--silver); font-weight: 700; font-size: 28px; letter-spacing: .14em; }
      #bug i { width: 12px; height: 12px; border-radius: 50%; background: #e0443a; box-shadow: 0 0 12px #e0443a; }

      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="119.6" data-width="1080" data-height="1920">

      <div id="s4-wang" class="scene-host" data-composition-id="s4-wang" data-composition-src="compositions/s4-wang.html"

      <div id="s5-air" class="scene-host" data-composition-id="s5-air" data-composition-src="compositions/s5-air.html"

      <div id="s6-zon" class="scene-host" data-composition-id="s6-zon" data-composition-src="compositions/s6-zon.html"
        data-start="74.52" data-duration="19.68" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="s7-musim" class="scene-host" data-composition-id="s7-musim" data-composition-src="compositions/s7-musim.html"
        data-start="94.2" data-duration="21.9" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="s8-outro" class="scene-host" data-composition-id="s8-outro" data-composition-src="compositions/s8-outro.html"
        data-start="116.1" data-duration="3.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:12"></div>

      <div id="captions" class="scene-host" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="116.1" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:15"></div>

      <div id="sweep"></div>
      <div id="flash"></div>

      <!-- Sound design (bundled Pixabay-licensed SFX). Voice stays on the <video> clips. -->
      <audio id="sx-open" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="0" data-duration="1.4" data-fade-out="0.7" data-volume="0.112" data-track-index="5"></audio>
      <audio id="sx-habis-w" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="3.42" data-duration="0.57" data-volume="0.28" data-track-index="6"></audio>
      <audio id="sx-habis" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="3.62" data-duration="1.4" data-fade-out="0.7" data-volume="0.091" data-track-index="5"></audio>
      <audio id="sx-mati" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="4.34" data-duration="1.4" data-fade-out="0.7" data-volume="0.105" data-track-index="7"></audio>
      <audio id="sx-cut1" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.95" data-duration="0.57" data-volume="0.38" data-track-index="6"></audio>
      <audio id="sx-lt" class="clip" src="assets/sfx/pop.mp3" data-start="6.25" data-duration="0.72" data-volume="0.35" data-track-index="8"></audio>

      <audio id="sx-72" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="32.05" data-duration="1.4" data-fade-out="0.7" data-volume="0.084" data-track-index="5"></audio>
      <audio id="sx-cutbar" class="clip" src="assets/sfx/whoosh.mp3" data-start="34.75" data-duration="0.57" data-volume="0.3" data-track-index="6"></audio>

      <audio id="sx-unsplit1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="51.05" data-duration="0.57" data-volume="0.26" data-track-index="6"></audio>

      <audio id="sx-72c" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="59.78" data-duration="1.4" data-fade-out="0.7" data-volume="0.07" data-track-index="5"></audio>
      <audio id="sx-cut2" class="clip" src="assets/sfx/whoosh.mp3" data-start="63.5" data-duration="0.57" data-volume="0.34" data-track-index="6"></audio>
      <audio id="sx-split2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="66.85" data-duration="0.57" data-volume="0.28" data-track-index="7"></audio>
      <audio id="sx-air" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="72.22" data-duration="1.4" data-fade-out="0.7" data-volume="0.091" data-track-index="5"></audio>
      <audio id="sx-cut3" class="clip" src="assets/sfx/whoosh.mp3" data-start="74.32" data-duration="0.57" data-volume="0.34" data-track-index="6"></audio>
      <audio id="sx-split3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="82.25" data-duration="0.57" data-volume="0.28" data-track-index="7"></audio>
      <audio id="sx-belum" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="88.12" data-duration="1.4" data-fade-out="0.7" data-volume="0.091" data-track-index="5"></audio>
      <audio id="sx-m1" class="clip" src="assets/sfx/pop.mp3" data-start="96.15" data-duration="0.72" data-volume="0.35" data-track-index="8"></audio>
      <audio id="sx-m2" class="clip" src="assets/sfx/pop.mp3" data-start="99.7" data-duration="0.72" data-volume="0.35" data-track-index="8"></audio>
      <audio id="sx-unsplit3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="102.6" data-duration="0.57" data-volume="0.26" data-track-index="6"></audio>
      <audio id="sx-habis2" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="106.5" data-duration="1.4" data-fade-out="0.7" data-volume="0.091" data-track-index="5"></audio>
      <audio id="sx-mati2" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="107.22" data-duration="1.4" data-fade-out="0.7" data-volume="0.105" data-track-index="7"></audio>
      <audio id="sx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="110.3" data-duration="3.98" data-media-start="0.3" data-volume="0.1" data-fade-in="0.6" data-track-index="9"></audio>
      <audio id="sx-segera" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="114.28" data-duration="1.4" data-fade-out="0.7" data-volume="0.14" data-track-index="5"></audio>
      <audio id="sx-outro" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="113.75" data-duration="3.9" data-volume="0.26" data-fade-out="1.0" data-track-index="6"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const FULL = "inset(0px 0px 0px 0px round 0px)";
      const PANEL = "inset(150px 36px 1100px 36px round 28px)";
      const cam = "#cam", mask = "#mask", pf = "#pframe";

      // split ("hyperframe"): footage becomes a framed panel holding the face; graphics live below it
      function splitOn(t) {
        tl.fromTo(mask, { clipPath: FULL }, { clipPath: PANEL, duration: 0.7, ease: "power3.inOut" }, t);
        tl.fromTo(pf, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, t + 0.35);
        tl.to("#scrim", { opacity: 0.35, duration: 0.6, ease: "power2.inOut" }, t);
      }
      function splitOff(t, d = 0.6) {
        tl.to(pf, { opacity: 0, duration: 0.2, ease: "power2.in" }, t);
        tl.fromTo(mask, { clipPath: PANEL }, { clipPath: FULL, duration: d, ease: "power3.inOut", immediateRender: false }, t);
        tl.to("#scrim", { opacity: 1, duration: d, ease: "power2.inOut" }, t);
      }
      function sweep(t) {
        tl.fromTo("#sweep", { x: 0, rotation: 18, opacity: 0 }, { x: 2300, opacity: 1, duration: 0.9, ease: "power2.inOut" }, t);
        tl.set("#sweep", { opacity: 0 }, t + 0.92);
      }
      function zoom(t, s, d, ease = "expo.out") { tl.to(cam, { scale: s, duration: d, ease }, t); }

      tl.set(cam, { scale: 1.3, x: 0, y: -120 }, 0);
      tl.set("#flash", { opacity: 0 }, 0);
      tl.set("#sweep", { opacity: 0, x: 0, rotation: 18 }, 0);
      tl.set(pf, { opacity: 0, scale: 1 }, 0);
      tl.set(mask, { clipPath: FULL }, 0);
      tl.set("#bug", { opacity: 1 }, 0);

      // 0–5.2 HOOK: tight on the face, slow push, two punch-ins on "habislah" / "matilah"
      zoom(0, 1.38, 3.5, "power1.inOut");
      zoom(3.64, 1.5, 0.16);
      zoom(4.36, 1.6, 0.16);
      tl.fromTo(cam, { x: 0 }, { x: 10, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, 4.36);

      // 5.2 cut → identity: light flash + sweep, wide frame
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.06, ease: "power2.out" }, 5.14);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 5.21);
      tl.set(cam, { scale: 1.0, x: 0, y: 0 }, 5.2);
      zoom(5.2, 1.06, 8.2, "power1.inOut");
      sweep(6.0);

      // ISI 1
      zoom(13.6, 1.14, 0.6);
      zoom(17.1, 1.0, 0.7, "power2.inOut");
      splitOn(23.9);
      // ISI 2
      zoom(48.36, 1.05, 0.3);
      splitOff(51.2);
      zoom(51.2, 1.08, 0.6, "power2.inOut");
      zoom(59.78, 1.2, 0.3);

      // 63.72 cut → ISI 3
      tl.set(cam, { scale: 1.0 }, 63.72);
      sweep(63.6);
      zoom(63.72, 1.04, 3.2, "power1.inOut");
      splitOn(67.0);
      splitOff(74.3, 0.2);

      // 74.52 cut → zoning
      tl.set(cam, { scale: 1.04 }, 74.52);
      sweep(74.4);
      zoom(74.52, 1.1, 7.6, "power1.inOut");
      splitOn(82.4);
      zoom(82.4, 1.0, 0.7, "power2.inOut");
      splitOff(102.8);

      // climax: their words, then the demand
      zoom(102.8, 1.12, 0.6, "power2.inOut");
      zoom(103.4, 1.18, 3.0, "power1.inOut");
      zoom(106.52, 1.3, 0.16);
      zoom(107.24, 1.4, 0.16);
      tl.fromTo(cam, { x: 0 }, { x: 10, duration: 0.05, ease: "none", yoyo: true, repeat: 3 }, 107.24);
      zoom(108.4, 1.08, 0.9, "power2.inOut");
      zoom(109.4, 1.22, 4.8, "power1.inOut");
      zoom(114.3, 1.34, 0.2);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.05 }, 114.28);
      tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 114.34);

      // outro: footage gives way to the end card
      tl.to("#bug", { opacity: 0, duration: 0.3 }, 115.9);
      tl.to("#cam", { opacity: 0, duration: 0.5, ease: "power2.in" }, 115.8);
      tl.set({}, {}, 119.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
