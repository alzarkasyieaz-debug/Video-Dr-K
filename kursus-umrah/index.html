<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KURSUS UMRAH INTERAKTIF — Fahami Dengan Tenang Ibadah Jadi Senang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&family=Poppins:wght@500;600;700;800&display=swap">
<style>
/*
  VOICE   khusyuk tetapi bertenaga — kursus mutawwif yang dipersembahkan seperti antara muka masa depan
  IDEA    "kompas cahaya": setiap slaid ialah panel hologram yang menyala di atas langit malam Makkah
  PICTURE gambar sebenar Tanah Suci dalam bingkai kubah bercahaya; rajah tawaf, sa'i dan miqat yang hidup
  COLOUR  biru malam angkasa, neon zamrud, emas cahaya, ungu jenama DM sebagai aksen halus
  TYPE    Poppins (tajuk), Inter (isi), Orbitron (angka & label HUD), Amiri (Arab, RTL)
*/
:root{
  --bg0:#040818;--bg1:#081131;--bg2:#0d1a45;--glass:rgba(16,30,72,.55);--glass2:rgba(22,40,92,.72);
  --line:rgba(120,170,255,.18);--line2:rgba(242,196,109,.45);
  --ink:#f4f1e8;--mut:#b6c2dc;--gold:#f2c46d;--gold2:#c9a44c;--emer:#2ef2b0;--emer2:#10b981;--violet:#a78bfa;--cyan:#5eead4;
  --rukun:#10b981;--wajib:#3b82f6;--sunat:#f2c46d;--larangan:#f43f5e;
  --ok:#34d399;--bad:#fb7185;
  --disp:Poppins,Inter,system-ui,sans-serif;--sans:Inter,system-ui,sans-serif;--hud:Rajdhani,Poppins,sans-serif;--ar:Amiri,"Noto Naskh Arabic",serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  background:radial-gradient(1200px 700px at 75% 20%,#16246a 0,transparent 60%),radial-gradient(900px 600px at 10% 90%,#0b3b4a 0,transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg0) 70%)}
#fx{position:absolute;inset:0;pointer-events:none}
.grid-floor{position:absolute;left:-20%;right:-20%;bottom:-10%;height:46%;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(46,242,176,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(46,242,176,.35) 1px,transparent 1px);background-size:80px 80px;
  transform:perspective(600px) rotateX(62deg);transform-origin:top;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 40%,transparent);animation:floor 6s linear infinite}
@keyframes floor{to{background-position:0 80px,0 0}}
.khatam{position:absolute;pointer-events:none;opacity:.16}
.khatam.k1{width:900px;height:900px;right:-260px;top:-300px;animation:spin 120s linear infinite}
.khatam.k2{width:520px;height:520px;left:-200px;bottom:-200px;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
#deck{position:absolute;inset:0 0 92px 0}
.slide{position:absolute;inset:0;overflow:hidden;visibility:hidden;opacity:0;clip-path:circle(0% at var(--cx,50%) var(--cy,50%));transition:clip-path .8s var(--ease),opacity .5s,visibility 0s .8s}
.slide.on{visibility:visible;opacity:1;clip-path:circle(150% at var(--cx,50%) var(--cy,50%));transition:clip-path .8s var(--ease),opacity .4s,visibility 0s}
.pad{position:absolute;inset:80px 80px 40px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3,p{margin:0}
.hud{font:700 18px/1 var(--hud);letter-spacing:.28em;text-transform:uppercase;color:var(--emer);display:flex;align-items:center;gap:14px}
.hud::before{content:"";width:46px;height:2px;background:linear-gradient(90deg,var(--emer),transparent);box-shadow:0 0 10px var(--emer)}
.title{font:800 66px/1.05 var(--disp);letter-spacing:-.01em;text-wrap:balance;max-width:1700px;
  background:linear-gradient(100deg,#fff 0,#fff3d6 40%,var(--gold) 60%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:-250% 0}}
.lead{font-size:34px;line-height:1.4;color:var(--mut);max-width:1500px}
.lead b,.hl{color:var(--gold)}
.big{font-size:34px;line-height:1.4}.body{font-size:27px;line-height:1.45}.cap{font:500 19px/1.4 var(--sans);color:var(--mut)}
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate;line-height:1.9;color:var(--gold)}
.src-tag{position:absolute;right:80px;top:30px;font:600 15px/1 var(--hud);letter-spacing:.18em;color:var(--mut);opacity:.7}
/* reveal */
.rv{opacity:0;transform:translateY(28px);filter:blur(8px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease)}
.slide.on .rv{opacity:1;transform:none;filter:none}
.slide.on .rv:nth-child(2){transition-delay:.12s}.slide.on .rv:nth-child(3){transition-delay:.24s}.slide.on .rv:nth-child(4){transition-delay:.36s}.slide.on .rv:nth-child(5){transition-delay:.48s}.slide.on .rv:nth-child(6){transition-delay:.6s}
.step{opacity:0;transform:translateY(22px) scale(.97);filter:blur(6px);transition:all .55s var(--ease)}
.step.shown{opacity:1;transform:none;filter:none}
/* glass card */
.card{position:relative;background:linear-gradient(160deg,var(--glass2),var(--glass));border:1px solid var(--line);border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;gap:12px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:linear-gradient(130deg,rgba(242,196,109,.7),transparent 35%,transparent 65%,rgba(46,242,176,.6));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55}
.card:hover{border-color:var(--line2);box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 40px rgba(46,242,176,.18)}
.card h3{font:700 36px/1.15 var(--disp)}
.num{font:800 46px/1 var(--disp);color:transparent;-webkit-text-stroke:1.5px var(--gold);text-shadow:0 0 18px rgba(242,196,109,.35)}
.grid{display:grid;gap:24px}
ul.pts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:18px}
ul.pts li{font-size:32px;line-height:1.35;display:flex;gap:18px;align-items:flex-start}
ul.pts li>span{flex:1}
ul.pts li::before{content:"";flex:none;width:14px;height:14px;margin-top:14px;border:2px solid var(--emer);transform:rotate(45deg);box-shadow:0 0 10px var(--emer)}
ul.pts.sm li{font-size:26px}ul.pts.sm li::before{margin-top:11px;width:11px;height:11px}
.cat{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;font:700 20px/1 var(--hud);letter-spacing:.12em;text-transform:uppercase;padding:10px 16px;border-radius:8px;border:1.5px solid currentColor;background:rgba(0,0,0,.25)}
.cat.rukun{color:var(--rukun)}.cat.rukun::before{content:"◆"}
.cat.wajib{color:#7fb0ff}.cat.wajib::before{content:"●"}
.cat.sunat{color:var(--sunat)}.cat.sunat::before{content:"○"}
.cat.larangan{color:var(--bad)}.cat.larangan::before{content:"✕"}
.cat.urus{color:var(--cyan)}.cat.urus::before{content:"✈"}
/* photo frame dome */
.dome{position:relative;overflow:hidden;border-radius:999px 999px 28px 28px;border:2px solid rgba(242,196,109,.7);box-shadow:0 0 0 8px rgba(242,196,109,.08),0 0 60px rgba(242,196,109,.25)}
.dome img,.frame img{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:relative;overflow:hidden;border-radius:24px;border:1px solid var(--line2);box-shadow:0 0 50px rgba(46,242,176,.15)}
.frame.contain img{object-fit:contain;background:#0a1230}
.scan::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(to bottom,transparent,rgba(46,242,176,.18),transparent);animation:scan 4.5s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.kenburns img{animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-2%,-2%)}}
.credit{position:absolute;right:12px;bottom:10px;font:500 14px/1 var(--sans);color:#fff;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:99px}
/* hero */
.hero-img{position:absolute;right:90px;top:70px;width:700px;height:860px}
.orbit{position:absolute;border:1.5px solid rgba(46,242,176,.4);border-radius:50%;pointer-events:none}
.orbit.o1{width:980px;height:980px;right:-50px;top:-30px;border-style:dashed;animation:spin 60s linear infinite}
.orbit.o2{width:840px;height:840px;right:20px;top:40px;border-color:rgba(242,196,109,.35);animation:spin 40s linear infinite reverse}
.orbit i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--emer);box-shadow:0 0 16px var(--emer);top:50%;left:-7px}
.orbit.o2 i{background:var(--gold);box-shadow:0 0 16px var(--gold);left:auto;right:-7px;top:30%}
.hero-tx{position:absolute;left:96px;top:0;bottom:0;width:880px;display:flex;flex-direction:column;justify-content:center;gap:30px}
.hero-tx h1{font:800 104px/.98 var(--disp);letter-spacing:-.02em}
.hero-tx h1 span{display:block;color:transparent;-webkit-text-stroke:2px var(--gold);text-shadow:0 0 40px rgba(242,196,109,.3)}
.hero-tx .sub{font:600 46px/1.15 var(--disp);color:var(--emer);text-shadow:0 0 24px rgba(46,242,176,.45)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:12px 26px;font-size:26px;color:var(--mut)}.meta b{color:var(--ink)}
.typed::after{content:"▍";color:var(--emer);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* divider */
.div-num{font:800 300px/.8 var(--disp);color:transparent;-webkit-text-stroke:2px rgba(242,196,109,.8);text-shadow:0 0 60px rgba(242,196,109,.25)}
/* buttons */
.btn{font:600 22px/1 var(--sans);color:var(--ink);background:rgba(14,26,64,.8);border:1.5px solid var(--line2);border-radius:14px;padding:14px 20px;cursor:pointer;min-height:54px;transition:all .25s}
.btn:hover{border-color:var(--emer);box-shadow:0 0 22px rgba(46,242,176,.35)}
.btn.pri{background:linear-gradient(120deg,#0f9f75,#10b981);border-color:transparent;color:#fff}
.btn.gold{background:linear-gradient(120deg,#e9b955,#f2c46d);border-color:transparent;color:#1a1408}
.btn[aria-pressed=true]{background:var(--gold);color:#1a1408}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
button:focus-visible,label:focus-within{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{display:flex;align-items:center;gap:18px;width:100%;text-align:left;font:500 29px/1.3 var(--sans);color:var(--ink);background:rgba(14,26,64,.7);border:2px solid var(--line);border-radius:18px;padding:18px 24px;cursor:pointer;transition:all .3s}
.opt:hover:not(:disabled){border-color:var(--emer);transform:translateY(-2px)}
.opt .k{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font:700 22px/1 var(--hud);border:1.5px solid var(--gold);color:var(--gold)}
.opt .fb{margin-left:auto;font-weight:700;font-size:24px;white-space:nowrap}
.opt.right{border-color:var(--ok);box-shadow:0 0 30px rgba(52,211,153,.35)}.opt.right .fb{color:var(--ok)}
.opt.wrong{border-color:var(--bad);box-shadow:0 0 30px rgba(251,113,133,.3)}.opt.wrong .fb{color:var(--bad)}
.opt:disabled{cursor:default}
.explain{background:rgba(46,242,176,.08);border:1px solid rgba(46,242,176,.35);border-radius:16px;padding:18px 24px;font-size:27px;line-height:1.45}
.score{margin-left:auto;font:700 22px/1 var(--hud);color:var(--gold);letter-spacing:.1em}
.q{font:700 54px/1.15 var(--disp);max-width:1700px;text-wrap:balance}
.story{font-size:32px;line-height:1.4;border-left:4px solid var(--gold);padding:8px 0 8px 24px;color:var(--mut)}
/* sequence */
.slots,.pool{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.slot{height:170px;border:2px dashed rgba(242,196,109,.5);border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;font:700 32px/1.2 var(--disp);text-align:center;padding:16px}
.slot .n{font:700 18px/1 var(--hud);color:var(--mut);letter-spacing:.15em}
.slot.fill{border-style:solid;border-color:var(--ok);background:rgba(52,211,153,.1);box-shadow:0 0 30px rgba(52,211,153,.25)}
.opt.card-o{height:140px;justify-content:center;text-align:center;font:700 32px/1.2 var(--disp)}
.shake{animation:shake .3s;border-color:var(--bad)!important}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.msg{font-size:30px;min-height:40px}
/* checklist */
.list{display:grid;grid-template-columns:1fr 1fr;gap:14px 36px}
.item{display:flex;align-items:center;gap:18px;font-size:27px;line-height:1.3;padding:14px 20px;background:rgba(14,26,64,.6);border:1.5px solid var(--line);border-radius:16px;cursor:pointer;transition:all .3s}
.item input{appearance:none;width:42px;height:42px;flex:none;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;margin:0;cursor:pointer}
.item input:checked{background:var(--emer2);border-color:var(--emer);box-shadow:0 0 18px rgba(46,242,176,.6)}
.item input:checked::after{content:"✓";color:#fff;font:700 28px/1 var(--sans)}
.item:has(input:checked){border-color:var(--emer)}
.item:has(input:checked) span{color:var(--mut);text-decoration:line-through}
.meter{flex:1;max-width:560px;height:12px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--emer),var(--gold));box-shadow:0 0 14px var(--emer);transition:width .5s}
/* tabs */
.tabs{display:flex;gap:12px;flex-wrap:wrap}
.tab{font:700 22px/1.1 var(--disp);color:var(--mut);background:rgba(14,26,64,.6);border:1.5px solid var(--line);border-radius:14px;padding:14px 20px;cursor:pointer;transition:all .3s}
.tab[aria-selected=true]{color:#1a1408;background:linear-gradient(120deg,#e9b955,#f2c46d);border-color:transparent;box-shadow:0 0 26px rgba(242,196,109,.4)}
.panel{display:none}.panel.on{display:flex;animation:pin .5s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(14px)}}
/* hotspot */
.hot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(46,242,176,.25);border:2px solid var(--emer);cursor:pointer;box-shadow:0 0 0 0 rgba(46,242,176,.6);animation:pulse 2s infinite}
.hot[aria-pressed=true]{background:var(--gold);border-color:var(--gold);animation:none;box-shadow:0 0 24px var(--gold)}
@keyframes pulse{70%{box-shadow:0 0 0 22px rgba(46,242,176,0)}100%{box-shadow:0 0 0 0 rgba(46,242,176,0)}}
/* sims */
.count{font:800 140px/1 var(--disp);color:var(--gold);text-shadow:0 0 30px rgba(242,196,109,.4)}.count small{font-size:50px;color:var(--mut)}
.status{font-size:30px;line-height:1.35;min-height:84px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:14px}.ctrl .btn{font-size:24px;min-height:66px}
.illus{display:inline-block;align-self:flex-start;font:700 15px/1 var(--hud);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:8px 14px}
svg text{font-family:var(--sans)}
/* flow */
.flow{position:relative;display:grid;gap:22px}
.flow .card{min-height:0}
.node{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:900 24px/1 var(--hud);color:#04121d;background:radial-gradient(circle,var(--emer),#0f9f75);box-shadow:0 0 24px rgba(46,242,176,.6)}
.beam{position:absolute;height:3px;background:linear-gradient(90deg,var(--emer),var(--gold));box-shadow:0 0 12px var(--emer);transform-origin:left;transform:scaleX(0);transition:transform 1.6s var(--ease) .3s}
.slide.on .beam{transform:scaleX(1)}
/* ===== FX futuristik ===== */
.flowline{animation:fdash 1s linear infinite}.flowline.rev{animation-direction:reverse}@keyframes fdash{to{stroke-dashoffset:-40}}
.sweep{animation:spin 6s linear infinite}.sweep.rev{animation-direction:reverse}
.spin-slow{animation:spin 60s linear infinite}.spin-rev{animation:spin 40s linear infinite reverse}
.fping{transform-box:fill-box;transform-origin:center;opacity:0}
.cur .fping{animation:fping 1.6s ease-out infinite}@keyframes fping{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
.fcard{opacity:.14;filter:blur(3px);transform:translateY(16px);transition:all .6s var(--ease)}.fcard.on{opacity:1;filter:none;transform:none}
.fcard.cur{border-color:var(--emer);box-shadow:0 0 44px rgba(46,242,176,.35),inset 0 0 30px rgba(46,242,176,.08)}
.fnode .fhex,.wn .wc{transition:fill .4s,stroke .4s}.fnode.done .fhex,.wn.done .wc{fill:#0f9f75;stroke:#2ef2b0}.fnode.done text,.wn.done text{fill:#04121d}
.fnode.cur .fhex,.wn.cur .wc{stroke:#2ef2b0;stroke-width:5;fill:#0b2a4a}.fhex2{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.wfloat{animation:wfloat 4s ease-in-out infinite}@keyframes wfloat{50%{transform:translateY(-12px)}}
.wscan{transform-box:fill-box;transform-origin:center;opacity:0;animation:wscan 3s ease-out infinite}@keyframes wscan{0%{opacity:.8;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-190px) scale(.55)}}
.mqwave{transform-box:fill-box;transform-origin:center;opacity:0;animation:mqwave 3s ease-out infinite}@keyframes mqwave{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(7)}}
.mq .mqring{transform-box:fill-box;transform-origin:center;opacity:0}.mq.on .mqring{animation:fping 1.4s ease-out infinite}
.mq.on .mqhalo{fill:rgba(242,196,109,.35);stroke:#f2c46d}.mqcore{animation:corepulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes corepulse{50%{transform:scale(1.25);opacity:.5}}
.tstart{animation:tglow 1.6s ease-in-out infinite}@keyframes tglow{50%{opacity:.45}}
.tkaabah{animation:tglow 3s ease-in-out infinite}
.tburst{transform-box:fill-box;transform-origin:center}.tburst.go{animation:burst .9s ease-out}@keyframes burst{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(4)}}
.tlap{display:grid;place-items:center;height:54px;border-radius:12px;font:700 26px/1 var(--hud);color:var(--mut);border:1.5px solid var(--line);background:rgba(14,26,64,.6);transition:all .4s}
.tlap.done{background:linear-gradient(135deg,#0f9f75,#10b981);color:#fff;border-color:var(--emer);box-shadow:0 0 18px rgba(46,242,176,.45)}
.tlap.cur{border-color:var(--gold);color:var(--gold);animation:tglow 1.2s ease-in-out infinite;box-shadow:0 0 18px rgba(242,196,109,.4)}
.szone.hot{animation:tglow .5s ease-in-out infinite}
.sbeam{animation:flick 1.8s ease-in-out infinite}.sbeam:nth-of-type(2n){animation-delay:.6s}@keyframes flick{0%,100%{opacity:.35}50%{opacity:1}}
.schev path{animation:chev 1.4s linear infinite}@keyframes chev{0%{opacity:.15}50%{opacity:1}100%{opacity:.15}}
.shill .hring{transform-box:fill-box;transform-origin:center;opacity:0}.shill.target .hring{animation:fping 1.5s ease-out infinite}
.sseg{display:flex;flex-direction:column;gap:6px;font:700 15px/1.1 var(--hud);letter-spacing:.06em;color:var(--mut)}
.sseg i{display:block;height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}.sseg b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--emer),var(--gold));box-shadow:0 0 12px var(--emer)}
.sseg.cur{color:var(--gold)}.sseg.done{color:var(--emer)}
/* ===== Profil mutawwif ===== */
.pfphoto{opacity:0}
.slide.on .pfphoto{animation:pfin 1.4s var(--ease) .2s forwards}
@keyframes pfin{0%{opacity:0;clip-path:inset(100% 0 0 0);filter:hue-rotate(90deg) saturate(2) brightness(1.6)}40%{opacity:1;filter:hue-rotate(40deg) saturate(1.6) brightness(1.3)}55%{transform:translateX(-6px)}60%{transform:translateX(5px)}65%{transform:none}100%{opacity:1;clip-path:inset(0 0 0 0);filter:none}}
.pfwrap .orbit{position:absolute}.pfo1{border-style:dashed;animation:spin 26s linear infinite}.pfo2{animation:spin 18s linear infinite reverse}
.pfwrap::after{content:"";position:absolute;left:70px;right:70px;bottom:6px;height:40px;border-radius:50%;background:radial-gradient(rgba(46,242,176,.45),transparent 70%);filter:blur(6px);animation:tglow 3s ease-in-out infinite}

{ch:"B",t:"quote",hud:"Pengertian Umrah",title:"Apa itu umrah?",quote:"Umrah ialah menziarahi Kaabah pada bila-bila masa untuk mengerjakan <b>tawaf</b>, <b>saie</b> dan <b>bercukur</b> mengikut syarat-syarat yang tertentu.",img:"kaabah-tawaf",src:src(12),notes:"Takrif seperti slaid asal 12."},
{ch:"B",t:"dalil",hud:"Hukum & Dalil Umrah",title:"Wajib sekali seumur hidup",pts:["Ibadah umrah merupakan salah satu kewajipan yang mesti dilaksanakan oleh setiap Muslim yang mukallaf.","Hukumnya <b>wajib sekali seumur hidup</b> apabila memenuhi syarat-syaratnya."],cards:[{h:"Firman Allah SWT",t:"“…dan sempurnakanlah ibadah haji dan umrah kerana Allah SWT.”",r:"Surah Al-Baqarah : 196"},{h:"Sabda Rasulullah SAW",t:"Dari Abu Hurairah RA: “Dosa di antara dua umrah akan terhapus dan haji mabrur (yang diterima) akan mendapat balasan syurga.”",r:"Riwayat Bukhari, Muslim, Tirmizi, Nasa’i, Ahmad, Ibnu Majah dan Malik"}],src:src(13,14),notes:"Dalil seperti tertulis dalam slaid asal 13–14 (terjemahan Melayu sahaja; teks Arab tidak dimasukkan kerana tiada dalam bahan asal)."},
{ch:"B",t:"flow8",hud:"Carta Alir Perjalanan Umrah",title:"Lapan fasa perjalanan anda",items:[["Persediaan di Malaysia","Tarikh cadangan & pemilihan pakej"],["Agensi Pelancongan","Ikut kemampuan kewangan"],["Pemilihan Pakej","Penerbangan direct atau transit — lihat 2 slaid seterusnya"],["Pengurusan Penerbangan","Imigresen & ketibaan di Jeddah"],["Umrah Pertama","Bimbingan mutawwif · niat ihram di miqat"],["Ziarah Madinah","Ziarah & penerangan sirah"],["Tawaf Wada’","Sebelum berangkat pulang"],["Penerbangan Pulang","Imigresen & pintu perlepasan"]],src:src(15,16,17),notes:"Slaid asal 15–17. Jenis pakej penerbangan (slaid 16): direct — terus ke Jeddah atau Madinah; transit — singgah sebentar mengikut syarikat penerbangan dan masa tertentu. Tekan Seterusnya untuk memaparkan setiap fasa."},
{ch:"B",t:"flight",m:0,src:src(16),notes:"Slaid asal 16: Penerbangan Direct (Terus) — penerbangan ini akan terus menuju ke Jeddah atau Madinah. Tekan Seterusnya untuk animasi pesawat; tekan lagi untuk ke slaid transit. Peta ialah ilustrasi arah, bukan laluan sebenar. Gambar Kaabah dan Masjid Nabawi daripada slaid 16."},
{ch:"B",t:"flight",m:1,src:src(16),notes:"Slaid asal 16: Penerbangan Transit — penerbangan ini singgah sebentar di lokasi mengikut syarikat penerbangan dan masa tertentu. Lokasi transit tidak dinamakan kerana bergantung pada pakej. Tekan Seterusnya untuk animasi. Gambar keluarga jemaah daripada slaid 16."},
{ch:"B",t:"rukunwajib",hud:"Rukun & Wajib Umrah",title:"Tujuh perkara utama",items:[["Niat Ihram Umrah","rukun"],["Di Miqat","wajib"],["Jaga Larangan Ihram","wajib"],["Tawaf","rukun"],["Sa‘ie","rukun"],["Tahallul","rukun"],["Tertib","rukun"]],src:src(18),notes:"Infografik slaid asal 18. Klik setiap kad (atau tekan Seterusnya) untuk simulasi ringkas setiap perkara. Rukun: tinggal = umrah tidak sah. Wajib: tinggal = dikenakan dam (lihat Bab F). Klik penapis untuk menyerlahkan kategori."},
{ch:"B",t:"tof",hud:"Aktiviti · Betul atau Perlu Dibetulkan?",items:[{st:"“Berniat ihram di miqat ialah rukun umrah.”",a:"fix",why:"Perlu dibetulkan: berniat ihram ialah RUKUN, tetapi melakukannya DI MIQAT ialah WAJIB umrah (slaid asal 18)."},{st:"“Tahallul (bercukur/bergunting) ialah salah satu rukun umrah.”",a:"ok",why:"Betul. Tahallul ialah rukun keenam dalam infografik slaid asal 18."},{st:"“Umrah boleh dikerjakan pada bila-bila masa sepanjang tahun.”",a:"ok",why:"Betul — Miqat Zamani umrah ialah sepanjang tahun, selain ketika seseorang sedang berihram haji (slaid asal 19)."}],src:src(18,19),notes:"Tiga kenyataan."},
/* C */
{ch:"C",t:"divider",n:"02",items:["Pengertian miqat","Peta miqat makani","Carta alir ibadah","Talbiah, ihram & larangan"],img:"haram-menara",src:"—",notes:"Bab miqat, niat dan ihram."},
{ch:"C",t:"miqatdef",hud:"Pengertian Miqat",title:"Miqat: masa & tempat berniat ihram",src:src(19),notes:"Slaid asal 19. Bahasa: waktu. Istilah: ketentuan masa/tempat untuk berniat ihram haji atau umrah. Berniat ihram di miqat adalah salah satu perkara wajib."},
{ch:"C",t:"miqatmap",hud:"Miqat Makani · Peta Interaktif",title:"Lima lokasi miqat",src:src(20,21,22,23,24),notes:"Klik setiap penanda: gambar masjid miqat (slaid asal 20–24) muncul dalam kad dan sebagai hologram di radar. Jarak hanya dipaparkan jika dinyatakan dalam slaid asal (Hudaibiah ~22 km, Qarnul Manazil ~94 km, Ja’ranah ~24 km). Rajah ialah ilustrasi arah — bukan skala sebenar."},
{ch:"C",t:"wheel",hud:"Carta Alir Ibadah Umrah",title:"Lapan langkah ibadah",items:["Mandi Sunat Ihram","Memakai Ihram","Berniat Ihram di Miqat","Tawaf Berittiba’","Berdoa di Multazam","Solat Sunat di Belakang Maqam Ibrahim","Sa‘ie antara Safa & Marwah","Bercukur @ Bergunting"],src:src(25),notes:"Roda slaid asal 25. Tekan Seterusnya — komet bergerak ke langkah berikutnya dan gambar di tengah roda bertukar dengan kesan iris. Gambar: miqat Bir Ali (slaid 24), pakaian ihram (slaid 29), Kaabah, pintu Kaabah/Multazam (slaid 49), Maqam Ibrahim (slaid 48), Safa (slaid 59), bercukur (slaid 66). Langkah 1 (mandi sunat) menggunakan grafik air kerana tiada foto dalam bahan asal."},
{ch:"C",t:"niat",src:src(26),notes:"Slaid asal 26 (versi JPG dalam folder +Updates). Kedua-dua lafaz (niat umrah dan niat umrah bersyarat) ditaip semula daripada slaid asal 26 — mohon semak harakat, khususnya perkataan “فَمَحِلُّ” seperti tertulis dalam slaid. Niat bersyarat sesuai bagi yang bimbang terhalang (sakit, haid, dsb.) — rujuk slaid Dam Ihsar."},
{ch:"C",t:"arabic",hud:"Lafaz Talbiah",ar:"لَبَّيْكَ ٱللَّٰهُمَّ لَبَّيْكَ، لَبَّيْكَ لَا شَرِيكَ لَكَ لَبَّيْكَ، إِنَّ ٱلْحَمْدَ وَٱلنِّعْمَةَ لَكَ وَٱلْمُلْكَ، لَا شَرِيكَ لَكَ",makna:"“HambaMu datang menyahut panggilanMu ya Allah, hambaMu datang menyahut panggilanMu. HambaMu datang menyahut panggilanMu, Tuhan yang tiada sekutu bagiMu. Sesungguhnya segala puji dan nikmat dan kerajaan adalah kepunyaanMu, tiada sekutu bagiMu.”",src:src(27),notes:"Teks Arab dan maksud disalin daripada slaid asal 27. Talbiah dibaca selepas berniat ihram."},
{ch:"C",t:"ihram",hud:"Pakaian Ihram Umrah",title:"Lelaki & wanita",src:src(28,29,30,31),notes:"Slaid asal 28–31 (gambar lelaki daripada slaid 30, wanita daripada slaid 31). Lelaki: dua helai kain lepas (tidak bercantum) — sehelai menutup aurat antara pusat dan lutut, sehelai lagi dibuat selendang; berittiba’ hanya ketika tawaf. Wanita: menutup semua anggota selain muka dan dua pergelangan tangan."},
{ch:"C",t:"larangan",src:src(32,33,34,35,36,37),notes:"Slaid asal 32–37 (versi JPG dalam folder +Updates). Klik setiap tab kategori atau tekan Seterusnya. Melanggar larangan dikenakan dam (Bahagian 05)."},
{ch:"C",t:"lsim",src:src(32,33,34,35,36,37,70,74),notes:"Simulasi interaktif. Pilih jemaah lelaki atau wanita, klik satu situasi, tanya audiens: elak atau teruskan? Klik ELAK — perisai menangkis; klik TERUSKAN — perisai retak dan kesan dam dipaparkan. Larangan daripada slaid asal 32–37; kesan/dam daripada slaid 74 (dan slaid 70 bagi kuku & sarung tangan). Situasi persetubuhan tidak dimasukkan dalam simulasi — rujuk slaid larangan."},
{ch:"C",t:"quiz",hud:"Kuiz · Miqat & Ihram",qs:[{q:"Jemaah yang datang dari arah Madinah berniat ihram di miqat mana?",o:["Masjid Aisyah Tan’eim","Bir Ali @ Zulhulaifah","Qarnul Manazil","Ja’ranah"],a:1,why:"Bir Ali @ Zulhulaifah ialah miqat bagi jemaah dari arah Madinah (slaid asal 24)."},{q:"Miqat yang paling hampir dengan Makkah ialah…",o:["Hudaibiah","Ja’ranah","Masjid Aisyah Tan’eim","Qarnul Manazil"],a:2,why:"Masjid Aisyah di Tan’eim ialah miqat paling hampir dengan Makkah (slaid asal 23)."},{q:"Bagi wanita, pakaian ihram mesti menutup seluruh tubuh KECUALI…",o:["Muka dan dua pergelangan tangan","Kaki","Rambut","Tiada pengecualian"],a:0,why:"Wanita menutup semua anggota selain muka dan dua pergelangan tangan (slaid asal 31)."},{q:"Larangan memakai sarung tangan ketika ihram terpakai kepada…",o:["Lelaki sahaja","Wanita sahaja","Lelaki dan wanita","Tiada larangan"],a:2,why:"Memakai sarung tangan dilarang bagi lelaki dan wanita (slaid asal 32)."}],src:src(23,24,31),notes:"Tiga soalan. Markah sesi pada peranti ini sahaja."},
/* D */
{ch:"D",t:"divider",n:"03",items:["Pengertian & syarat tawaf","Jenis-jenis tawaf","Penjuru Kaabah & lampu hijau","Ibadah selepas tawaf"],img:"kaabah-tawaf",src:"—",notes:"Bab ibadah tawaf."},
{ch:"D",t:"quote",hud:"Ibadah Tawaf",title:"Tawaf",quote:"Mengelilingi Kaabah sebanyak <b>7 pusingan</b> bermula dan berakhir di <b>Hajarul Aswad</b> dengan syarat-syarat tertentu. Elakkan perbualan yang sia-sia.",img:"menara-jam-makkah",src:src(38),notes:"Slaid asal 38."},
{ch:"D",t:"syarat",hud:"Syarat-Syarat Sah Tawaf",title:"Sembilan syarat — klik untuk buka",items:["Suci dari hadas dan berwudu’","Suci badan, pakaian dan tempat tawaf daripada najis","Menutup aurat","Berniat melakukan tawaf","Bermula dan berakhir pada sudut Hajarul Aswad","Berjalan bertujuan tawaf, bukan yang lain","Menjadikan Baitullah di sebelah kiri dan berjalan mengelilingi Kaabah","Cukup 7 kali dengan yakin","Dilakukan dalam masjid, di luar Hijir Ismail dan tidak menyentuh mana-mana bahagian Kaabah"],src:src(39,40,41),notes:"Slaid asal 39–41. Klik kad untuk mendedahkan setiap syarat, atau tekan Seterusnya."},
{ch:"D",t:"hex",hud:"Jenis-Jenis Tawaf",title:"Enam jenis tawaf",items:[["Qudum","Tawaf pertama yang dilakukan oleh jemaah haji apabila tiba di Mekah untuk haji atau umrah."],["Sunat","Tawaf pilihan yang boleh dilakukan oleh umat Islam pada bila-bila masa."],["Ifadhah","Tawaf yang menjadi rukun haji, dilakukan selepas pulang wukuf di Arafah. Juga dinamakan bagi tawaf rukun umrah."],["Umrah","Tawaf yang menjadi rukun ibadah umrah."],["Nazar","Tawaf untuk memenuhi nazarnya."],["Wada’","Tawaf perpisahan yang dilakukan oleh jemaah haji atau umrah sebelum meninggalkan Mekah."]],src:src(42,43,44,45,46,47),notes:"Slaid asal 42–47. Klik heksagon untuk penerangan. (Penerangan 'Tawaf Umrah' diringkaskan daripada slaid 44 — sahkan.)"},
{ch:"D",t:"sunattawaf",hud:"Sunat-Sunat Tawaf",title:"Enam amalan sunat ketika tawaf",cols:3,cards:[{h:"01 · Berdoa",t:"Berdoa pada setiap pusingan."},{h:"02 · Berturut-turut",t:"Tujuh kali pusingan secara berturut-turut."},{h:"03 · Pakaian putih",t:"Memakai pakaian putih."},{h:"04 · Berittiba’",t:"Bagi lelaki — kain di bawah ketiak kanan."},{h:"05 · Berlari-lari anak",t:"Pada 3 pusingan pertama, bagi lelaki."},{h:"06 · Istilam",t:"Istilam ke Hajarul Aswad lalu mengucup tangan; juga Rukun Yamani."}],src:src(48),notes:"Slaid asal 48 (versi JPG dalam +Updates). Klik setiap kad (atau tekan Seterusnya) untuk simulasi ringkas setiap amalan sunat. Simulasi ialah ilustrasi."},
{ch:"D",t:"arabic",hud:"Niat Tawaf Umrah",ar:"اَللَّهُمَّ إِنِّي أُرِيدُ طَوَافَ بَيْتِكَ الْحَرَامِ سَبْعَةَ أَشْوَاطٍ طَوَافَ الْعُمْرَةِ لِلَّهِ تَعَالَى",makna:"“Ya Allah, aku hendak tawaf Baitul-Haram, tujuh keliling, tawaf umrah, kerana Allah Taala.”",src:src(49),notes:"Teks Arab dan maksud disalin daripada slaid asal 49 — ditaip semula; mohon semak baris Arab."},
{ch:"D",t:"tdist",src:src(50),notes:"Slaid asal 50 (Peta Tawaf, sumber dalam slaid: Uwais Madinah). 1 pusingan 350–500 m; 7 pusingan ≈ 3.5 km. Ingatkan jemaah warga emas tentang stamina."},
{ch:"D",t:"kaabah",hud:"Rukun @ Penjuru Kaabah",title:"Kenali empat penjuru",src:src(52,53,54,55),notes:"Slaid asal 52–55. Klik penanda pada rajah. Doa Rukun Yamani (Al-Baqarah 201) disalin daripada slaid 55."},
{ch:"D",t:"lampu",hud:"Lampu Hijau",title:"Penanda permulaan tawaf",src:src(51,52),notes:"Slaid asal 51–52. Lampu hijau di mataf sejajar penjuru Aswad — supaya jemaah tidak sesat dan terlupa. Istilam sambil menyebut “Bismillahi Allahu Akbar ×3 Walillahilhamd” pada permulaan setiap pusingan."},
{ch:"D",t:"tawaf",src:src(38,40,41,51),notes:"Simulasi ilustrasi: mula di garis lampu hijau sejajar Hajarul Aswad, Kaabah di kiri, di luar Hijir Ismail, 7 pusingan. HUD menunjukkan anggaran jarak (350–500 m sepusingan, slaid 50) dan peringatan sunat berlari-lari anak bagi lelaki pada 3 pusingan pertama (slaid 48). Main = satu pusingan; Langkah = satu penjuru."},
{ch:"D",t:"after",hud:"Ibadah Selepas Tawaf",title:"Tiga amalan selepas tawaf",items:[["Berdoa di Multazam","Kawasan antara Hajar Aswad dan Pintu Kaabah — jika ada ruang"],["Solat Sunat Tawaf","Di belakang Maqam Nabi Ibrahim"],["Minum Air Zam-Zam","Berdiri & duduk"]],ph:["st-multazam","st-maqam",null],src:src(56),notes:"Slaid asal 56."},
{ch:"D",t:"quiz",hud:"Kuiz · Tawaf",qs:[{q:"Penjuru Kaabah manakah yang sunnah disentuh ketika tawaf sunat?",o:["Penjuru Iraqi","Penjuru Syami","Rukun Yamani","Penjuru Hijir"],a:2,why:"Sunnah menyentuh Rukun Yamani sekiranya melakukan tawaf sunat (slaid asal 55)."},{q:"Tawaf perpisahan sebelum meninggalkan Mekah dinamakan…",o:["Tawaf Qudum","Tawaf Wada’","Tawaf Nazar","Tawaf Ifadhah"],a:1,why:"Tawaf Wada’ ialah tawaf perpisahan (slaid asal 45)."},{q:"Di manakah Maqam Ibrahim terletak?",o:["Antara Penjuru Aswad & Penjuru Iraqi","Dalam Hijir Ismail","Di Rukun Yamani","Di atas Kaabah"],a:0,why:"Maqam Ibrahim terletak antara Penjuru Aswad dan Penjuru Iraqi (slaid asal 53)."}],src:src(45,53,55),notes:"Tiga soalan."},
/* E */
{ch:"E",t:"divider",n:"04",items:["Pengertian & jarak Safa–Marwah","Syarat sah sa‘ie","Sunat sa‘ie & lampu hijau","Simulasi sa‘ie"],img:"saie-atas",src:"—",notes:"Bab ibadah sa‘ie."},
{ch:"E",t:"saiedef",hud:"Ibadah Sa‘ie",title:"Berjalan berulang-alik antara Safa & Marwah",src:src(57,58,59,60),notes:"Slaid asal 57, 58 & 60. Safa dan Marwah: bukit batu hitam pejal, tinggi 15 meter, di dinding Masjidil Haram. Laluan tingkat atas, skuter dan kerusi roda disediakan."},
{ch:"E",t:"syaratsaie",hud:"Syarat-Syarat Sah Sa‘ie",title:"Lima syarat sah",items:["Dilakukan selepas tawaf (mengikut tertib)","Dimulakan dari Safa dan berakhir di Marwah","Mesti sempurna sebanyak 7 kali","Dilakukan kerana ibadah, bukan kerana sebab lain","Dilakukan di Batnul Wadi (tempat yang termaklum)"],src:src(62),notes:"Slaid asal 62."},
{ch:"E",t:"sunatsaie",hud:"Sunat Sa‘ie & Lampu Hijau",title:"Berlari-lari anak di kawasan lampu hijau",src:src(61,63,64,65),notes:"Slaid asal 61 & 64. Sembilan sunat daripada slaid 63, 64 dan 65 (versi JPG dalam +Updates)."},
{ch:"E",t:"saie",src:src(57,61,62),notes:"Simulasi ilustrasi: mula di Safa, akhir di Marwah, 7 perjalanan. Zon hijau menandakan kawasan lampu hijau (lelaki berlari-lari anak). Kedudukan zon ialah ilustrasi."},
{ch:"F",t:"divider",n:"05",items:["Bercukur @ bergunting","Tertib rukun umrah","Aktiviti susun tertib"],img:"st-cukur",src:src(66,67),notes:"Bab tahallul — menamatkan ibadah umrah."},
{ch:"F",t:"tahallul",src:src(66,67),notes:"Slaid asal 66 & 67."},

/* F */
{ch:"G",t:"divider",n:"06",items:["Pengertian dam","Empat jenis dam","Cara melaksanakan dam ihsar"],img:"haram-koridor",src:"—",notes:"Bab dam."},
{ch:"G",t:"dam",src:src(68),notes:"Slaid asal 68. DM (Darul Mubarak) membantu menguruskan dam di Mekah sekiranya jemaah terlupa dan telah pulang ke Malaysia."},
{ch:"G",t:"damtabs",src:src(69,70,71,72,73),notes:"Slaid asal 69–73. Klik tab untuk setiap jenis dam. Cupak: secupak = sehari puasa."},
{ch:"G",t:"denda",src:src(74),notes:"Slaid asal 74 (Perlanggaran Hukum dan Dendanya). ⚠ Item 8 dalam slaid asal berbunyi “awal dendanya menyembelih seekor kambing” — perkataan “awal” mungkin salah taip. Item 2 (lebih 12 helai rambut) berbeza daripada ringkasan Dam Tertib dan Taqdir di slaid 70 — penceramah mohon selaraskan."},
{ch:"G",t:"quiz",kind:"scenario",hud:"Senario · Apa tindakan anda?",qs:[{story:"Pak Ali terlupa dan memotong kuku selepas berniat ihram.",q:"Perkara ini termasuk dalam dam jenis apa?",o:["Dam Tertib dan Taqdir","Dam Ihsar","Tiada dam","Dam Takhyir (tumbuhan)"],a:0,why:"Memotong rambut atau kuku termasuk sebab Dam Tertib dan Taqdir (slaid asal 70): sembelih seekor kambing; jika tidak mampu, puasa 10 hari (3 di Mekah, 7 di kampung)."},{story:"Mak Som jatuh sakit teruk selepas berniat ihram dan terpaksa dihantar pulang ke Malaysia sebelum sempat tawaf.",q:"Apakah jalan keluar menurut slaid kursus?",o:["Teruskan pantang larang ihram selama-lamanya","Bertahallul ihsar dengan Dam Ihsar","Tiada apa-apa perlu dibuat","Dam Takhyir"],a:1,why:"Pesakit berat yang terpaksa dihantar pulang termasuk keadaan Dam Ihsar (slaid asal 69, 73)."},{story:"Selepas pulang ke Malaysia, Haji Daud baru sedar dia terlupa satu perkara wajib dan dikenakan dam.",q:"Apa yang boleh dilakukan?",o:["Abaikan sahaja","Hubungi Darul Mubarak untuk bantuan menguruskan dam di Mekah","Ulang umrah tahun depan","Bayar kepada sesiapa sahaja"],a:1,why:"Slaid asal 68: DM akan membantu menguruskan dam di Mekah."}],src:src(68,69,70,73),notes:"Tiga senario berdasarkan slaid dam."},
/* G */
{ch:"H",t:"divider",n:"07",items:["Tawaf wada’","Ziarah Makkah · Madinah · Taif","Masjid Nabawi & Raudhah","Aplikasi Nusuk"],img:"nabawi-kubah-hijau",src:"—",notes:"Bab Madinah dan Nusuk."},
{ch:"H",t:"quote",hud:"Tawaf Wada’",title:"Tawaf selamat tinggal",quote:"Tawaf yang menyatakan <b>‘selamat tinggal’</b> kepada Kaabah yang mulia kerana permusafiran melebihi dua marhalah atau meninggalkan kota Mekah. Hukumnya <b>WAJIB</b> di sisi Mazhab As-Syafi‘i.",img:"menara-jam-makkah",src:src(75),notes:"Slaid asal 75. Slaid ini menyatakan rujukan Mazhab As-Syafi‘i."},
{ch:"H",t:"arabic",hud:"Niat Tawaf Wada’",ar:"اَللَّهُمَّ إِنِّي أُرِيْدُ طَوَافَ بَيْتِكَ الْحَرَامِ سَبْعَةَ أَشْوَاطٍ طَوَافَ الْوَدَاعِ فَيَسِّرْهُ لِي وَتَقَبَّلْهُ مِنِّي لِلَّهِ تَعَالَى",makna:"“Ya Allah, sahaja aku tawaf di Baitullah ini tujuh pusingan kerana tawaf selamat tinggal, maka permudahkanlah pekerjaanku dan terimalah kerana Allah Taala.”",src:src(76),notes:"Teks Arab dan maksud disalin daripada slaid asal 76 — sila semak baris Arab."},
{ch:"H",t:"tawaf",w:1,src:src(45,75,76),notes:"Simulasi tawaf wada’ — sama seperti tawaf umrah: mula di garis lampu hijau sejajar Hajarul Aswad, Kaabah di sebelah kiri, di luar Hijir Ismail, 7 pusingan. Tawaf wada’ ialah tawaf perpisahan sebelum meninggalkan Makkah (slaid 45, 75); niatnya pada slaid 76. Ilustrasi panduan."},

{ch:"H",t:"quote",hud:"Ziarah",title:"Makkah · Madinah · Taif",quote:"Ibadah umrah pastinya disertai <b>ziarah</b>, terutama tempat-tempat yang disebut dalam kitab sirah. Dalam pakej Darul Mubarak, jemaah berpeluang menziarahi <b>Makkah</b>, <b>Madinah</b> dan <b>Taif</b>.",img:"nabawi-kubah-hijau",src:src(78),notes:"Slaid asal 78."},

damtabs:()=>{const D=[["Tertib & Taqdir","<b class='hl'>Denda:</b> menyembelih seekor kambing. Jika tidak mampu, berpuasa 10 hari — 3 hari di Mekah dan 7 hari di kampung sekembalinya.","Antara sebabnya: memakai pakaian berjahit · memotong rambut atau kuku · menggunakan harum-haruman · berciuman & sentuhan syahwat · melakukan larangan-larangan ihram · meninggalkan salah satu perkara wajib haji dan umrah."],["Tertib & Takdil","Jika tidak mampu memberi makan fakir miskin senilai seekor unta, diganti dengan berpuasa 10 hari: 3 hari di tanah suci, baki di tanah air.","<b class='hl'>1. Bersetubuh</b> setelah tahallul pertama atau sebelum selesai kerja umrah: sembelih seekor unta / lembu / 7 ekor kambing / sedekah makanan senilai seekor unta / puasa sebanyak bilangan cupak senilai seekor unta — wajib menghabiskan kerja umrah dan qada tahun berikutnya. <b class='hl'>2. Tersekat</b> selepas berihram (sakit, dikepung musuh): bertahallul ihsar — sembelih seekor kambing & bergunting / makanan senilai seekor kambing / puasa (secupak sehari)."],["Takhyir & Takdil","Takhyir bererti damnya boleh dipilih satu daripada perkara yang ditetapkan.","<b class='hl'>1. Membunuh binatang buruan</b> di tanah suci: sembelih binatang sama besar / makanan senilai untuk fakir miskin Mekah / puasa (secupak sehari). <b class='hl'>2. Menebang, mengerat atau mencabut tumbuhan</b> di tanah Mekah: sembelih binatang mengikut bilangan pokok (besar: lembu; kecil: kambing) / wang harga tafsiran dibelikan makanan untuk fakir miskin Mekah / puasa."],["Ihsar","Untuk melepaskan diri daripada larangan ihram bagi yang sudah berniat tetapi tidak dapat menyelesaikan rukun kerana peperangan, musuh, wabak, penyakit — termasuk wanita yang haid dan terpaksa pulang segera, atau pesakit berat yang dihantar pulang.","Sembelih seekor kambing & bercukur/bergunting → jika tidak mampu, makanan senilai seekor kambing untuk fakir miskin di tempat tahallul → jika tidak mampu, puasa (1 cupak = 1 hari) + bercukur dengan niat taha
