        --navy: #07111f;
        --navy-2: #0d1d33;

        --gold: #f2c55c;
        --gold-deep: #b8892c;
        --silver: #e7ebf2;
        --font: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--charcoal); font-family: var(--font);
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* ---------- ground (seen around the "hyperframe" panel) ---------- */
      #bg { position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(900px 700px at 50% 30%, rgba(40,74,124,.55), transparent 70%),
          radial-gradient(700px 600px at 50% 95%, rgba(242,197,92,.10), transparent 70%),
          linear-gradient(180deg, #0a1628 0%, #07111f 55%, #05080f 100%);
      }
      /* vertical fins: abstract nod to the tower's sun-screen rhythm (decorative only) */
      #bg-fins { position: absolute; inset: 0; z-index: 1; opacity: .5;
        background: repeating-linear-gradient(90deg, rgba(231,235,242,.045) 0 2px, transparent 2px 54px);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 80%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 80%, transparent 100%);
      }

      /* ---------- camera rig: #cam moves, #mask crops, videos are timed ---------- */
      #cam { position: absolute; inset: 0; z-index: 2; transform-origin: 540px 500px; }
      #mask { position: absolute; inset: 0; clip-path: inset(0px 0px 0px 0px round 0px); }
      #mask video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      #pframe { position: absolute; z-index: 3; left: 36px; top: 150px; width: 1008px; height: 670px;
        border-radius: 28px; border: 2px solid rgba(242,197,92,.85); opacity: 0;
        box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 80px rgba(0,0,0,.65), 0 0 40px rgba(242,197,92,.18) inset;
      }
      #pframe-tag { position: absolute; left: 22px; bottom: -19px; padding: 6px 14px; border-radius: 6px;
        background: var(--gold); color: #1a1406; font-weight: 800; font-size: 28px; letter-spacing: .12em; }

      #scrim { position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(4,8,16,.55) 0%, rgba(4,8,16,0) 16%),
          linear-gradient(180deg, rgba(4,8,16,0) 52%, rgba(4,8,16,.62) 66%, rgba(4,8,16,.88) 80%, rgba(4,8,16,.94) 100%);
      }
      #grade-vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(1100px 1500px at 50% 38%, transparent 55%, rgba(0,0,0,.45) 100%); }

      #flash { position: absolute; inset: 0; z-index: 30; background: #fff7e2; opacity: 0; pointer-events: none; }
      #sweep { position: absolute; z-index: 29; left: -700px; top: -200px; width: 520px; height: 2400px; opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(255,236,190,.0) 20%, rgba(255,236,190,.28) 50%, rgba(255,236,190,0) 80%, transparent);
        pointer-events: none; }

      #bug { position: absolute; z-index: 20; left: 44px; top: 186px; display: flex; align-items: center; gap: 12px;

      #bug i { width: 12px; height: 12px; border-radius: 50%; background: #e0443a; box-shadow: 0 0 12px #e0443a; }

      .scene-host { position: absolute; inset: 0; }

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const FULL = "inset(0px 0px 0px 0px round 0px)";
      const PANEL = "inset(150px 36px 1100px 36px round 28px)";
      const cam = "#cam", mask = "#mask", pf = "#pframe";

      // split ("hyperframe"): footage becomes a framed panel holding the face; graphics live below it
      function splitOn(t) {
        tl.fromTo(mask, { clipPath: FULL }, { clipPath: PANEL, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t);
        tl.to(cam, { y: -100, scale: 1.0, duration: 0.7, ease: "power3.inOut" }, t);
        tl.fromTo(pf, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.35);
        tl.to("#scrim", { opacity: 0.35, duration: 0.6, ease: "power2.inOut" }, t);
      }
      function splitOff(t, d = 0.6) {
        tl.to(pf, { opacity: 0, duration: 0.2, ease: "power2.in" }, t);
        tl.fromTo(mask, { clipPath: PANEL }, { clipPath: FULL, duration: d, ease: "power3.inOut", immediateRender: false }, t);
        tl.to(cam, { y: 0, duration: d, ease: "power3.inOut" }, t);
        tl.to("#scrim", { opacity: 1, duration: d, ease: "power2.inOut" }, t);
      }
      function sweep(t) {
        tl.fromTo("#sweep", { x: 0, rotation: 18, opacity: 0 }, { x: 2300, opacity: 1, duration: 0.9, ease: "power2.inOut", immediateRender: false }, t);
        tl.set("#sweep", { opacity: 0 }, t + 0.92);
      }
      function zoom(t, s, d, ease = "expo.out") { tl.to(cam, { scale: s, duration: d, ease }, t); }

      tl.set(cam, { scale: 1.3, x: 0, y: -140 }, 0);
      tl.set(mask, { clipPath: FULL }, 0);
      tl.set("#flash", { opacity: 0 }, 0);
      tl.set("#sweep", { opacity: 0, x: 0, rotation: 18 }, 0);
      tl.set(pf, { opacity: 0, scale: 1 }, 0);

      // 0–5.1 HOOK: "Angka 3.0% adalah angka yang menipu realiti."
      zoom(0, 1.38, 3.4, "power1.inOut");
      zoom(3.58, 1.5, 0.16);
      tl.fromTo(cam, { x: 0 }, { x: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, 3.58);

      // 5.1 cut → identity
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.06, ease: "power2.out", immediateRender: false }, 5.04);
      tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, 5.11);
      tl.set(cam, { scale: 1.0, x: 0, y: 0 }, 5.1);
      zoom(5.1, 1.06, 4.0, "power1.inOut");
      sweep(5.8);
      zoom(9.19, 1.12, 0.5);   // jump cut hidden by a punch-in

      // ISI 1–2: national figures, youth bands
      splitOn(14.8);
      zoom(29.3, 1.04, 0.3);
      zoom(34.9, 1.0, 0.3, "power2.out");
      splitOff(38.6);
      zoom(38.6, 1.1, 6.0, "power1.inOut");

      // ISI 3: quality of work
      zoom(45.3, 1.0, 0.6, "power2.inOut");
      zoom(50.2, 1.16, 0.25);
      splitOn(53.2);
      splitOff(68.2, 0.5);

      // ISI 4: Parit
      zoom(68.45, 1.08, 2.7, "power1.inOut");
      zoom(71.2, 1.18, 0.25);
      splitOn(72.0);

      // 80.98 cut → solution
      sweep(80.85);
      tl.set(cam, { scale: 1.0 }, 80.98);
      zoom(84.67, 1.04, 0.3);  // cut hidden by a punch-in
      splitOff(99.8);
      zoom(99.8, 1.1, 0.6, "power2.inOut");
      zoom(100.4, 1.24, 3.8, "power1.inOut");
      zoom(104.28, 1.34, 0.2);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.35, duration: 0.05, immediateRender: false }, 104.26);
      tl.to("#flash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 104.32);

      // outro
      tl.to("#bug", { opacity: 0, duration: 0.3 }, 107.4);
      tl.to("#cam", { opacity: 0, duration: 0.5, ease: "power2.in" }, 107.3);
      tl.set({}, {}, 111.17);

      window.__timelines["main"] = tl;
    </script>
