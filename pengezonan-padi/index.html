        top: 1180px;

        inset: 0;
        background: #000;

        position: absolute;
        inset: 0;

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Face centre in the 1080x1440 plate: (525, 680). Keep the plate covering the frame.
      const FX = 525, FY = 680;
      const frame = (s, fy = 900) => {
        const y = Math.min(0, Math.max(1920 - 1440 * s, fy - FY * s));
        const x = Math.min(0, Math.max(1080 - 1080 * s, 540 - FX * s));
        return { scale: s, x, y };
      };
      const WIDE = 1.36;
      const dipCut = (t) => {
        tl.to("#dip", { opacity: 0.4, duration: 0.1, ease: "power1.in" }, t - 0.1);
        tl.set("#dip", { opacity: 0 }, t);
      };

      // A · hook: wide, hard punch-in on "strategik", slow push.
      tl.set("#cam", frame(WIDE), 0);
      tl.set("#cam", frame(1.62, 780), 2.86);
      tl.to("#cam", { ...frame(1.7, 780), duration: 5.4, ease: "none" }, 2.86);
      dipCut(8.28);

      // B · facts: wide push; tighten on "Sudah tiba masanya".
      tl.set("#cam", frame(WIDE), 8.28);
      tl.to("#cam", { ...frame(1.46, 880), duration: 13.0, ease: "none" }, 8.28);
      tl.set("#cam", frame(1.58, 820), 21.31);
      tl.to("#cam", { ...frame(1.64, 820), duration: 11.1, ease: "none" }, 21.31);
      dipCut(32.45);

      // C · problems: close-up, punch harder on "lebih 50%".
      tl.set("#cam", frame(1.62, 790), 32.45);
      tl.to("#cam", { ...frame(1.68, 790), duration: 12.3, ease: "none" }, 32.45);
      tl.set("#cam", frame(1.82, 770), 44.85);
      tl.to("#cam", { ...frame(1.86, 770), duration: 6.5, ease: "none" }, 44.85);
      tl.to("#cam", { ...frame(1.5, 860), duration: 1.0, ease: "power2.inOut" }, 51.4);
      dipCut(56.09);

      // D · proposals: wide, slow push.
      tl.set("#cam", frame(WIDE), 56.09);
      tl.to("#cam", { ...frame(1.48, 870), duration: 14.6, ease: "none" }, 56.09);
      dipCut(70.71);

      // E · climax: cinematic close-up.
      tl.set("#cam", frame(1.7, 780), 70.71);
      tl.to("#cam", { ...frame(1.8, 770), duration: 11.8, ease: "none" }, 70.71);

      // F · end card on the held last frame; fade out.
      tl.to("#cam", { ...frame(1.9, 770), duration: 6.5, ease: "none" }, 82.51);
      tl.to("#dip", { opacity: 1, duration: 0.9, ease: "power2.in" }, 88.1);

      window.__timelines["main"] = tl;
    </script>
