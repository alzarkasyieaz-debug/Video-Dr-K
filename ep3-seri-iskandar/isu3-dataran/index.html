  <head>
    <meta charset="UTF-8" />

    <title>Isu 3: Dataran Sungai Seluang — Dewan Rakyat</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --navy: #07111f;
        --navy-2: #0d1d33;
        --charcoal: #0b0d12;
        --gold: #f2c55c;
        --gold-deep: #b8892c;
        --silver: #e7ebf2;
        --font: Inter, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--charcoal); font-family: var(--font);
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* ---------- ground (seen around the "hyperframe" panel) ---------- */
      #bg { position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(900px 700px at 50% 30%, rgba(40,74,124,.55), transparent 70%),
          radial-gradient(700px 600px at 50% 95%, rgba(242,197,92,.10), transparent 70%),
          linear-gradient(180deg, #0a1628 0%, #07111f 55%, #05080f 100%);
      }
      /* vertical fins: abstract nod to the tower's sun-screen rhythm (decorative only) */
      #bg-fins { position: absolute; inset: 0; z-index: 1; opacity: .5;
        background: repeating-linear-gradient(90deg, rgba(231,235,242,.045) 0 2px, transparent 2px 54px);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 80%, transparent 100%);
                mask-image: linear-gradient(180deg, transparent 0%, #000 45%, #000 80%, transparent 100%);
      }

      /* ---------- camera rig: #cam moves, #mask crops, videos are timed ---------- */
      #mask { position: absolute; inset: 0; z-index: 2; clip-path: inset(0px 0px 0px 0px round 0px); }
      #cam { position: absolute; inset: 0; transform-origin: 540px 640px; }
      #cam video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      #pframe { position: absolute; z-index: 3; left: 36px; top: 150px; width: 1008px; height: 670px;
        border-radius: 28px; border: 2px solid rgba(242,197,92,.85); opacity: 0;
        box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 80px rgba(0,0,0,.65), 0 0 40px rgba(242,197,92,.18) inset;
      }
      #pframe-tag { position: absolute; left: 22px; bottom: -19px; padding: 6px 14px; border-radius: 6px;
        background: var(--gold); color: #1a1406; font-weight: 800; font-size: 28px; letter-spacing: .12em; }

      #scrim { position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(4,8,16,.55) 0%, rgba(4,8,16,0) 16%),
          linear-gradient(180deg, rgba(4,8,16,0) 52%, rgba(4,8,16,.62) 66%, rgba(4,8,16,.88) 80%, rgba(4,8,16,.94) 100%);
      }
      #grade-vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none;
        background: radial-gradient(1100px 1500px at 50% 38%, transparent 55%, rgba(0,0,0,.45) 100%); }

      #flash { position: absolute; inset: 0; z-index: 30; background: #fff7e2; opacity: 0; pointer-events: none; }
      #sweep { position: absolute; z-index: 29; left: -700px; top: -200px; width: 520px; height: 2400px; opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(255,236,190,.0) 20%, rgba(255,236,190,.28) 50%, rgba(255,236,190,0) 80%, transparent);
        pointer-events: none; }

      #bug { position: absolute; z-index: 20; left: 44px; top: 186px; display: flex; align-items: center; gap: 12px;
        padding: 10px 18px 10px 14px; border-radius: 10px; background: rgba(7,17,31,.72);
        border: 1px solid rgba(242,197,92,.45); color: var(--silver); font-weight: 700; font-size: 28px; letter-spacing: .14em; }
      #bug i { width: 12px; height: 12px; border-radius: 50%; background: #e0443a; box-shadow: 0 0 12px #e0443a; }

      .scene-host { position: absolute; inset: 0; }
    </style>
  </head>
        <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42.38" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="bg-fins"></div>

      <div id="mask">
        <div id="cam">
          <!-- Original Dewan Rakyat footage (clip C, RTM 1280×720), cropped to 9:16 around the MP; cleaned voice baked in -->
          <video id="v1" class="clip" src="assets/footage/dewan-seri-iskandar.mp4" playsinline data-has-audio="true"
            data-start="0.00" data-duration="38.88" data-media-start="264.68" data-fade-in="0.04" data-fade-out="0.25"
            data-volume="1" data-track-index="1"></video>
        </div>
      </div>
      <div id="pframe"><span id="pframe-tag">RAKAMAN ASAL</span></div>
      <div id="grade-vignette"></div>
      <div id="scrim"></div>

      <div id="bug"><i></i>UCAPAN DI DEWAN RAKYAT</div>

      <div id="d1-hook" class="scene-host" data-composition-id="d1-hook" data-composition-src="compositions/d1-hook.html"
        data-start="0" data-duration="8.8" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="d2-id" class="scene-host" data-composition-id="d2-id" data-composition-src="compositions/d2-id.html"
        data-start="8.8" data-duration="6.0" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="d3-naiktaraf" class="scene-host" data-composition-id="d3-naiktaraf" data-composition-src="compositions/d3-naiktaraf.html"
        data-start="14.8" data-duration="24.08" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:10"></div>
      <div id="d4-outro" class="scene-host" data-composition-id="d4-outro" data-composition-src="compositions/d4-outro.html"
        data-start="38.88" data-duration="3.5" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:12"></div>

      <div id="captions" class="scene-host" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="38.88" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:15"></div>

      <div id="sweep"></div>
      <div id="flash"></div>

      <!-- Sound design (bundled Pixabay-licensed SFX). Voice stays on the <video> clips. -->
      <audio id="sx00" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="0" data-duration="1.4" data-fade-out="0.7" data-volume="0.1" data-track-index="5"></audio>
      <audio id="sx01" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="4.42" data-duration="1.4" data-fade-out="0.7" data-volume="0.09" data-track-index="6"></audio>
      <audio id="sx02" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.6" data-duration="0.57" data-volume="0.34" data-track-index="7"></audio>
      <audio id="sx03" class="clip" src="assets/sfx/pop.mp3" data-start="9.4" data-duration="0.72" data-volume="0.35" data-track-index="8"></audio>
      <audio id="sx04" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="14.65" data-duration="0.57" data-volume="0.28" data-track-index="9"></audio>
      <audio id="sx05" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="15.3" data-duration="1.4" data-fade-out="0.7" data-volume="0.07" data-track-index="5"></audio>
      <audio id="sx06" class="clip" src="assets/sfx/pop.mp3" data-start="19.02" data-duration="0.72" data-volume="0.3" data-track-index="6"></audio>
      <audio id="sx07" class="clip" src="assets/sfx/pop.mp3" data-start="21.82" data-duration="0.72" data-volume="0.3" data-track-index="7"></audio>
      <audio id="sx08" class="clip" src="assets/sfx/pop.mp3" data-start="23.62" data-duration="0.72" data-volume="0.3" data-track-index="8"></audio>
      <audio id="sx09" class="clip" src="assets/sfx/pop.mp3" data-start="24.52" data-duration="0.72" data-volume="0.3" data-track-index="9"></audio>
      <audio id="sx10" class="clip" src="assets/sfx/pop.mp3" data-start="27.02" data-duration="0.72" data-volume="0.3" data-track-index="5"></audio>
      <audio id="sx11" class="clip" src="assets/sfx/pop.mp3" data-start="27.42" data-duration="0.72" data-volume="0.3" data-track-index="6"></audio>
      <audio id="sx12" class="clip" src="assets/sfx/riser.mp3" data-start="26.6" data-duration="3.98" data-media-start="0.3" data-fade-in="0.6" data-volume="0.08" data-track-index="7"></audio>
      <audio id="sx13" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="30.62" data-duration="1.4" data-fade-out="0.7" data-volume="0.1" data-track-index="8"></audio>
      <audio id="sx14" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="36.3" data-duration="3.9" data-fade-out="1.0" data-volume="0.24" data-track-index="9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const FULL = "inset(0px 0px 0px 0px round 0px)";
      const PANEL = "inset(150px 36px 1100px 36px round 28px)";
      const cam = "#cam", mask = "#mask", pf = "#pframe";
      const BASE = { s: 1.12, y: -150 };   // source is 405×720 upscaled; this keeps the face clear of the lower band

      function splitOn(t) {
        tl.fromTo(mask, { clipPath: FULL }, { clipPath: PANEL, duration: 0.7, ease: "power3.inOut", immediateRender: false }, t);
        tl.to(cam, { y: -230, scale: BASE.s, duration: 0.7, ease: "power3.inOut" }, t);
        tl.fromTo(pf, { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out", immediateRender: false }, t + 0.35);
        tl.to("#scrim", { opacity: 0.35, duration: 0.6, ease: "power2.inOut" }, t);
      }
      function splitOff(t, d = 0.6) {
        tl.to(pf, { opacity: 0, duration: 0.2, ease: "power2.in" }, t);
        tl.fromTo(mask, { clipPath: PANEL }, { clipPath: FULL, duration: d, ease: "power3.inOut", immediateRender: false }, t);
        tl.to(cam, { y: BASE.y, duration: d, ease: "power3.inOut" }, t);
        tl.to("#scrim", { opacity: 1, duration: d, ease: "power2.inOut" }, t);
      }
      function sweep(t) {
        tl.fromTo("#sweep", { x: 0, rotation: 18, opacity: 0 }, { x: 2300, opacity: 1, duration: 0.9, ease: "power2.inOut", immediateRender: false }, t);
        tl.set("#sweep", { opacity: 0 }, t + 0.92);
      }
      function flash(t, o = 0.55) {
        tl.fromTo("#flash", { opacity: 0 }, { opacity: o, duration: 0.06, ease: "power2.out", immediateRender: false }, t - 0.06);
        tl.to("#flash", { opacity: 0, duration: 0.35, ease: "power2.out" }, t + 0.01);
      }
      function zoom(t, s, d, ease = "expo.out") { tl.to(cam, { scale: s, duration: d, ease }, t); }
      function cut(t, s, y = BASE.y) { tl.set(cam, { scale: s, y }, t); }   // a new framing on every jump cut
      function shake(t) { tl.fromTo(cam, { x: 0 }, { x: 8, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, t); }

      tl.set(cam, { scale: 1.42, x: 0, y: -260 }, 0);
      tl.set(mask, { clipPath: FULL }, 0);
      tl.set("#flash", { opacity: 0 }, 0);
      tl.set("#sweep", { opacity: 0, x: 0, rotation: 18 }, 0);
      tl.set(pf, { opacity: 0, scale: 1 }, 0);

      // one continuous take: tight → base → panel
      zoom(0, 1.5, 4.3, "power1.inOut");
      zoom(4.42, 1.6, 0.16); shake(4.42);
      tl.to(cam, { scale: BASE.s, y: BASE.y, duration: 0.8, ease: "power2.inOut" }, 8.6);
      sweep(8.9);
      zoom(9.4, 1.18, 5.2, "power1.inOut");
      splitOn(14.65);
      splitOff(38.6, 0.25);

      // outro
      tl.to("#bug", { opacity: 0, duration: 0.3 }, 38.68);
      tl.to("#cam", { opacity: 0, duration: 0.5, ease: "power2.in" }, 38.58);
      tl.set({}, {}, 42.38);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
