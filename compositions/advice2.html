      // Two periods wide so a shift of one period loops without a seam.
      function wave(baseY, amp, period) {
        let d = `M 0 ${baseY}`;
        for (let x = 0; x <= 2160 + 20; x += 20) {
          d += ` L ${x} ${(baseY + Math.sin((x / period) * Math.PI * 2) * amp).toFixed(1)}`;

      }

        l.setAttribute("x1", x);
        l.setAttribute("y1", y);
        l.setAttribute("x2", x - len * 0.18);
        l.setAttribute("y2", y + len);

      }

      const tl = gsap.timeline({ paused: true });

      // Parallax: nearer waves travel faster.
